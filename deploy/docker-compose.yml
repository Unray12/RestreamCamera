name: restreamcamera

# Production layout: both containers share the host network so that
# RTSP/UDP, SRT, HLS and WebRTC work without publishing every ephemeral port.
#
#   cd deploy && cp .env.example .env && docker compose up -d --build
#
# Reachable after start:
#   http://<host>:8080        UI + API
#   rtsp://<host>:8554/<slug> virtual cameras
#   http://<host>:8888/<slug>/index.m3u8  HLS
#   http://<host>:8889/<slug>            WHEP (WebRTC)
#   srt://<host>:8890?streamid=...       SRT
#
# Already running another MediaMTX/RestreamCamera on this host? Set the
# RC_*_PORT variables in .env (see .env.example) to move every port — no
# edits to this file or mediamtx.yml needed. Each stack needs its own .env
# and ports (and its own `-p <name>` / COMPOSE_PROJECT_NAME if run side by
# side, since the default project name "restreamcamera" is shared).

services:
  mediamtx:
    image: bluenviron/mediamtx:1.21.3
    container_name: rc-mediamtx
    restart: unless-stopped
    network_mode: host
    environment:
      MTX_APIADDRESS: 127.0.0.1:${RC_MEDIA_API_PORT:-9997}
      MTX_METRICSADDRESS: 127.0.0.1:${RC_MEDIA_METRICS_PORT:-9998}
      MTX_RTSPADDRESS: :${RC_RTSP_PORT:-8554}
      MTX_HLSADDRESS: :${RC_HLS_PORT:-8888}
      MTX_WEBRTCADDRESS: :${RC_WEBRTC_PORT:-8889}
      MTX_WEBRTCLOCALUDPADDRESS: :${RC_WEBRTC_UDP_PORT:-8189}
      MTX_SRTADDRESS: :${RC_SRT_PORT:-8890}
      MTX_AUTHHTTPADDRESS: http://127.0.0.1:${RC_HTTP_PORT:-8080}/api/v1/mediamtx/auth
    volumes:
      - ./mediamtx.yml:/mediamtx.yml:ro
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

  api:
    build:
      context: ../backend
      args:
        VERSION: ${RC_VERSION:-dev}
    image: ${RC_IMAGE:-restreamcamera-api}:${RC_TAG:-latest}
    container_name: rc-api
    restart: unless-stopped
    network_mode: host
    depends_on:
      - mediamtx
    environment:
      RC_LISTEN: 0.0.0.0:${RC_HTTP_PORT:-8080}
      # Control API and RTSP live on localhost because of host networking.
      RC_MEDIA_API: http://127.0.0.1:${RC_MEDIA_API_PORT:-9997}
      RC_MEDIA_METRICS: http://127.0.0.1:${RC_MEDIA_METRICS_PORT:-9998}
      RC_MEDIA_RTSP_BASE: rtsp://127.0.0.1:${RC_RTSP_PORT:-8554}
      RC_MEDIA_RTSP_LOOPBACK: rtsp://127.0.0.1:${RC_RTSP_PORT:-8554}
      # Addresses handed out to clients (VMS, ffplay, browsers).
      RC_PUBLIC_RTSP: ${RC_PUBLIC_HOST:-localhost}:${RC_RTSP_PORT:-8554}
      RC_PUBLIC_HLS: http://${RC_PUBLIC_HOST:-localhost}:${RC_HLS_PORT:-8888}
      RC_PUBLIC_WEBRTC: http://${RC_PUBLIC_HOST:-localhost}:${RC_WEBRTC_PORT:-8889}
      RC_ADMIN_USER: ${RC_ADMIN_USER:-admin}
      RC_ADMIN_PASSWORD: ${RC_ADMIN_PASSWORD:-admin}
      RC_MASTER_KEY: ${RC_MASTER_KEY:-}
      RC_LOG_LEVEL: ${RC_LOG_LEVEL:-info}
      RC_RECONCILE_INTERVAL: ${RC_RECONCILE_INTERVAL:-5s}
    volumes:
      # SQLite database + master key. On Linux hosts run:
      #   sudo mkdir -p data && sudo chown -R 10001:10001 data
      - ./data:/data
    stop_grace_period: 20s
    healthcheck:
      test: ["CMD", "/usr/local/bin/restreamd", "healthcheck"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
