###############################################
# RestreamCamera — MediaMTX (development, bridge networking)
#
# Differences from mediamtx.yml:
#   * RTSP over TCP only (Docker Desktop on Windows does not forward the
#     ephemeral UDP ports MediaMTX allocates per RTSP session).
#   * The control plane is reached by service name (api:8080).
#   * WebRTC advertises 127.0.0.1 so a browser on the host can connect.
###############################################

logLevel: debug
logDestinations: [stdout]

readTimeout: 10s
writeTimeout: 10s
writeQueueSize: 2048

api: true
apiAddress: :9997

metrics: true
metricsAddress: :9998

pprof: false
playback: false

rtsp: true
rtspAddress: :8554
rtspTransports: [tcp]
rtspAuthMethods: [basic]

rtmp: false
moq: false

hls: true
hlsAddress: :8888
hlsVariant: fmp4
hlsSegmentCount: 5
hlsSegmentDuration: 1s
hlsPartDuration: 200ms
hlsAllowOrigins: ["*"]

webrtc: true
webrtcAddress: :8889
webrtcEncryption: false
webrtcAllowOrigins: ["*"]
webrtcLocalUDPAddress: :8189
webrtcIPsFromInterfaces: false
webrtcAdditionalHosts: ["127.0.0.1"]

srt: true
srtAddress: :8890

authMethod: http
authHTTPAddress: http://api:8080/api/v1/mediamtx/auth
authHTTPExclude:
  - action: api
  - action: metrics
  - action: pprof

authInternalUsers:
  - user: any
    ips: []
    permissions:
      - action: api
      - action: metrics
      - action: pprof

paths: {}
